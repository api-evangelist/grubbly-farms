tools:
- name: search_catalog
  description: Search for products from the online store, hosted on Shopify. Supports natural-language
    queries and/or filter criteria; results are paginated via pagination.cursor. Conforms to the UCP catalog
    search capability (dev.ucp.shopping.catalog.search).
- name: get_cart
  description: Get the cart including items, shipping options, discount info, and checkout url for a given
    cart id.
- name: update_cart
  description: Perform updates to a cart, including adding/removing/updating line items, buyer information,
    shipping details, discount codes, gift cards and notes in one consolidated call. Shipping options
    become available after adding items and a delivery address. When creating a new cart, only addItems
    is required.
- name: search_shop_policies_and_faqs
  description: Used to get facts about the store's policies, products, or services.
- name: get_product_details
  description: Look up a product by ID. Pass the 'options' parameter to select a specific variant for
    the product card. Without options, the first available variant is returned.
