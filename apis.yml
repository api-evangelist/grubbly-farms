aid: grubbly-farms
name: Grubbly Farms
description: >-
  Grubbly Farms is a direct-to-consumer backyard-poultry brand that sells chicken and
  duck feed, treats, supplements, and coop supplies made with dried black soldier fly
  grubs raised on upcycled food surplus as a sustainable protein source. The storefront
  runs on Shopify and, like other Shopify merchants, exposes a real machine-consumable
  surface: a hosted Storefront MCP server at /api/mcp (product catalog search, cart
  management, product detail lookup, and shop-policy/FAQ retrieval) and a Shopify Customer
  Account identity surface published through OpenID Connect / OAuth 2.0 discovery documents
  (authorization-code with PKCE), including Shopify's customer-account-api and
  customer-account-mcp-api scopes. This profile captures that discoverable agent and
  identity surface rather than a traditional developer-published REST API.
